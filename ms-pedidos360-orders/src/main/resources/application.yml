server:
  port: 8082

spring:
  application:
    name: ms-pedidos360-orders
  datasource:
    url: jdbc:postgresql://localhost:5433/ordersdb
    username: sa
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

# Configuración centralizada de RabbitMQ
rabbitmq:
  host: 172.31.18.41
  port: 5672
  username: guest
  password: guest
  exchanges:
    direct: cmd.direct
    topic: cmd.topic
    dlx: cmd.dead.dlx
  queues:
    email: q.cmd.email
    email-dlq: q.cmd.email.dlq
  routing-keys:
    email: email.send