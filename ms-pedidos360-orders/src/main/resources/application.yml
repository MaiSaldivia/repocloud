server:
  port: 8082

spring:
  application:
    name: ms-pedidos360-orders
  datasource:
    url: jdbc:h2:mem:ordersdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
    host: 172.31.18.41
    port: 5672
    username: guest
    password: guest

# Configuración centralizada de RabbitMQ para la pauta
rabbitmq:
  exchanges:
    direct: cmd.direct
    topic: cmd.topic
    dlx: cmd.dead.dlx
  queues:
    email: q.cmd.email
    email-dlq: q.cmd.email.dlq
  routing-keys:
    email: email.send